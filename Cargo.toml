[package]
name = "inputswap"
version = "0.2.0"
edition = "2021"
description = "Switches Assetto Corsa to the wheel mid-session, even one plugged in after launch"

[lib]
# Built as dinput8.dll: acs.exe loads it from its own folder at start, before the system one.
name = "dinput8"
crate-type = ["cdylib"]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
]

[profile.release]
panic = "abort"
